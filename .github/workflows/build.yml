name: Build PhotoShelf APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTOSHELF_KEYSTORE_BASE64 }}
          PHOTOSHELF_KEY_PASSWORD: ${{ secrets.PHOTOSHELF_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$PHOTOSHELF_KEY_PASSWORD" ]; then
            echo "::error::Add the PHOTOSHELF_KEYSTORE_BASE64 and PHOTOSHELF_KEY_PASSWORD repository secrets, then re-run this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/photoshelf.jks"
          export PHOTOSHELF_KEYSTORE_FILE="$RUNNER_TEMP/photoshelf.jks"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PhotoShelf.apk

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoShelf-apk
          path: PhotoShelf.apk

      - name: Publish to the "app" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: PhotoShelf (latest build)
          body: |
            Latest PhotoShelf build ${{ github.run_number }} from commit ${{ github.sha }}.
            Download PhotoShelf.apk on your phone and open it to install or update.
          files: PhotoShelf.apk
          make_latest: true
